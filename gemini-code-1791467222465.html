<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>작은 1일 1시 노트</title>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f0ebd8;
            background-image: radial-gradient(#e2d9bc 1px, transparent 1px);
            background-size: 20px 20px;
            font-family: 'Gowun Dodum', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            perspective: 1500px;
        }

        /* 세로로 길쭉한 직사각형 노트 비율 (가로 480px, 세로 680px) */
        .container {
            width: 480px;
            height: 680px;
            position: relative;
            transform-style: preserve-3d;
        }

        /* 노트 표지 (한국식: 왼쪽에 제본, 오른쪽으로 열림) */
        .cover {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #7a2021, #5c1718);
            border-radius: 4px 12px 12px 4px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3), inset 5px 0 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 100;
            transform-origin: left center;
            transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
            border-left: 12px solid #3d0e0e;
        }

        .cover.open {
            transform: rotateY(-180deg);
            pointer-events: none;
        }

        .cover-content {
            text-align: center;
            border: 2px solid #d4af37;
            padding: 50px 30px;
            border-radius: 6px;
            box-shadow: inset 0 0 10px rgba(212, 175, 55, 0.3);
            width: 80%;
        }

        .cover h1 {
            font-family: 'Nanum Myeongjo', serif;
            color: #f3e5ab;
            font-size: 2.3rem;
            margin-bottom: 15px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .cover p {
            color: #d4af37;
            font-size: 1.05rem;
            letter-spacing: 1px;
        }

        /* 노트 내부 바인딩 */
        .notebook {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #fff;
            border-radius: 4px 12px 12px 4px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            display: flex;
            overflow: hidden;
            border-left: 12px solid #e0d6c3;
        }

        /* 한국식 책넘김: 왼쪽 제본축 기준 회전 (-180도) */
        .page-spread {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            transform-style: preserve-3d;
            transform-origin: left center;
            transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
        }

        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: linear-gradient(to right, #f4ecd8 20px, #fffdf9 30px);
            padding: 50px 45px 50px 55px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            backface-visibility: hidden;
            box-shadow: inset -10px 0 20px rgba(0,0,0,0.02);
        }

        /* 시 본문 영역 */
        .poem-header {
            font-size: 0.9rem;
            color: #8c7355;
            margin-bottom: 20px;
            border-bottom: 1px dashed #d4c5a9;
            padding-bottom: 10px;
        }

        .poem-title {
            font-family: 'Nanum Myeongjo', serif;
            font-size: 1.5rem;
            color: #2c221e;
            margin-bottom: 30px;
            font-weight: 700;
        }

        .poem-body {
            font-family: 'Nanum Myeongjo', serif;
            font-size: 1.2rem;
            line-height: 2.1;
            color: #4a3b32;
            flex-grow: 1;
            white-space: pre-line;
        }

        .page-number {
            text-align: right;
            font-size: 0.9rem;
            color: #a38f75;
            margin-top: 10px;
        }

        /* 네비게이션 버튼 */
        .nav-controls {
            position: absolute;
            bottom: -65px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
            z-index: 200;
        }

        .nav-btn {
            background: #7a2021;
            color: #fff;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Gowun Dodum', sans-serif;
            font-size: 0.95rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: background 0.2s, transform 0.1s;
        }

        .nav-btn:hover {
            background: #5c1718;
            transform: scale(1.05);
        }

        .nav-btn:disabled {
            background: #d1c7bd;
            cursor: not-allowed;
            transform: none;
        }

        /* 마지막 축하 완료 화면 (41번째 페이지 역할) */
        .completion-spread {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            transform-style: preserve-3d;
            transform-origin: left center;
            transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
        }

        .back-cover {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: linear-gradient(135deg, #7a2021, #5c1718);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #f3e5ab;
            font-family: 'Nanum Myeongjo', serif;
            text-align: center;
            padding: 40px;
            border-radius: 4px 12px 12px 4px;
            box-shadow: inset 5px 0 15px rgba(0,0,0,0.3);
            backface-visibility: hidden;
        }

        .back-cover h2 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .back-cover p {
            font-family: 'Gowun Dodum', sans-serif;
            font-size: 1.05rem;
            color: #e2d9bc;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .next-step-btn {
            background: #d4af37;
            color: #2c221e;
            border: none;
            padding: 12px 28px;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Gowun Dodum', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: background 0.2s, transform 0.1s;
        }

        .next-step-btn:hover {
            background: #f3e5ab;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="container" id="notebookContainer">
        <!-- 표지 -->
        <div class="cover" id="bookCover" onclick="openBook()">
            <div class="cover-content">
                <h1 id="coverTitle">작은 1일 1시</h1>
                <p id="coverSub">설레는 사랑시 40선</p>
                <p style="font-size: 0.85rem; margin-top: 25px; color: #f3e5ab; opacity: 0.8;">클릭하여 노트를 펼치세요</p>
            </div>
        </div>

        <!-- 노트 내부 -->
        <div class="notebook" id="notebookBody">
            <!-- 페이지들은 자바스크립트로 동적 생성됩니다 -->
        </div>

        <!-- 좌우 이동 버튼 -->
        <div class="nav-controls">
            <button class="nav-btn" id="prevBtn" onclick="prevPage()" disabled>이전으로</button>
            <button class="nav-btn" id="nextBtn" onclick="nextPage()">다음으로</button>
        </div>
    </div>

    <script>
        // 세트 1: 설레는 사랑시 40선
        const set1 = [
            { id: 1, category: "1번 시: 일상 속에서 피어나는 설렘", title: "김남조 - '너를 향하여'", text: "내 마음의 바다에\n네가 물결치며 다가올 때\n세상의 모든 소음은 잦아들고\n오직 너의 이름만 울려 퍼진다." },
            { id: 2, category: "2번 시: 일상 속에서 피어나는 설렘", title: "나태주 - '너와 함께라면'", text: "풀꽃 같은 너를 바라보는 것만으로도\n내 하루는 온통 봄날이었다\n멀리 있어도 그리운 사람이여\n오늘 밤도 내 꿈속으로 걸어와 다오." },
            { id: 3, category: "3번 시: 일상 속에서 피어나는 설렘", title: "도종환 - '흔들리며 피는 꽃'", text: "흔들리지 않고 피는 꽃이 어디 있으랴\n이 세상 그 어떤 아름다운 꽃들도\n다 흔들리면서 피었나니\n너를 사랑하는 내 마음도 그러하다." },
            { id: 4, category: "4번 시: 일상 속에서 피어나는 설렘", title: "이해인 - '사랑의 지혜'", text: "사랑하는 이여\n내가 너를 향해 부르는 노래는\n언제나 처음 시작하는 아침의 기도처럼\n맑고 순수한 떨림이어라." },
            { id: 5, category: "5번 시: 일상 속에서 피어나는 설렘", title: "정호승 - '너에게'", text: "즐겁고 슬픈 일들이 많았던 세상에서\n오직 너라는 존재 하나만으로\n내 가슴은 벅찬 기쁨으로 채워지고\n나는 비로소 살아있음을 느낀다." },
            { id: 6, category: "6번 시: 일상 속에서 피어나는 설렘", title: "황동규 - '즐거운 편지'", text: "진실로 진실로 내가 그대를 사랑하는 까닭은\n내 나의 사랑을 늘 새롭게 할 수 있는 까닭은\n그대가 내게 다가온 그날 이후로\n세상 모든 길이 너를 향해 열렸기 때문이다." },
            { id: 7, category: "7번 시: 일상 속에서 피어나는 설렘", title: "김용택 - '달이 차오른다'", text: "너를 생각하는 이 밤에\n달빛이 창가에 조용히 스며들면\n내 마음의 고요한 호수 위로\n네가 살포시 걸어 들어온다." },
            { id: 8, category: "8번 시: 일상 속에서 피어나는 설렘", title: "원태연 - '손끝'", text: "스쳐 지나가는 바람 속에서도\n네 향기가 묻어나는 것 같아\n자꾸만 뒤돌아보게 되는 내 마음은\n온통 너로 가득 차 있다." },
            { id: 9, category: "9번 시: 일상 속에서 피어나는 설렘", title: "이정하 - '낮은 대문'", text: "네가 다가오는 소리가 들리면\n굳게 닫혀 있던 내 마음의 문도\n스르륵 열려버리고 만다\n너는 나의 가장 따뜻한 봄이다." },
            { id: 10, category: "10번 시: 일상 속에서 피어나는 설렘", title: "이채 - '사랑하는 날에는'", text: "네 눈빛을 마주할 때마다\n멈춰 있던 시간들이 다시 흐르고\n내 가슴속 깊은 곳에서부터\n참아왔던 꽃망울이 터져 나온다." },
            { id: 11, category: "11번 시: 가슴 뛰는 그리움과 만남", title: "서정주 - '신부'", text: "달은 붉고 꽃은 하얗게 피어나는 밤\n네가 나를 향해 걸어오는 그 발걸음마다\n세상의 모든 아름다움이\n비로소 완성되는 기분이 든다." },
            { id: 12, category: "12번 시: 가슴 뛰는 그리움과 만남", title: "윤동주 - '서시'", text: "별을 노래하는 마음으로\n모든 죽어가는 것을 사랑해야지\n그리고 나한테 주어진 길을\n너와 함께 걸어갈 수 있다면." },
            { id: 13, category: "13번 시: 가슴 뛰는 그리움과 만남", title: "김소월 - '진달래꽃'", text: "나 보기 역겨워 가실 때에는\n죽어도 아니 눈물 흘리오리다마는\n네가 다시 내게 돌아오는 그날에는\n온 세상 꽃을 뿌려 너를 맞이하리라." },
            { id: 14, category: "14번 시: 가슴 뛰는 그리움과 만남", title: "한용운 - '님의 침묵'", text: "아, 님은 갔지만은 나는 그를 보내지 아니하였습니다\n제 호흡의 쿵쾅거림 속에 네가 있고\n내 시선의 끝마리마다 네가 머무니\n너는 언제나 내 곁에 살아 숨 쉰다." },
            { id: 15, category: "15번 시: 가슴 뛰는 그리움과 만남", title: "김춘수 - '꽃'", text: "내가 그의 이름을 불러 주기 전에는\n그는 다만 하나의 몸짓에 지나지 않았다\n내가 그의 이름을 불러 주었을 때\n그는 나에게로 와서 꽃이 되었다." },
            { id: 16, category: "16번 시: 가슴 뛰는 그리움과 만남", title: "조병화 - '의자'", text: "가만히 앉아 너를 기다리는 이 시간이\n내게는 세상에서 가장 행복한 기다림이다\n네가 문을 열고 들어설 때\n내 온 세상이 환해진다." },
            { id: 17, category: "17번 시: 가슴 뛰는 그리움과 만남", title: "박목월 - '가을의 기도'", text: "네가 내게 건네준 따뜻한 말 한마디가\n쓸쓸하던 내 가슴속에 불을 지피고\n찬 바람 부는 이 계절마저\n포근한 품처럼 느껴지게 만든다." },
            { id: 18, category: "18번 시: 가슴 뛰는 그리움과 만남", title: "김지하 - '너에게'", text: "타는 목마름으로, 타는 목마름으로\n너를 찾아 헤매던 긴긴밤이 지나고\n마주 잡은 두 손의 온기를 통해\n우리는 비로소 하나가 된다." },
            { id: 19, category: "19번 시: 가슴 뛰는 그리움과 만남", title: "기형도 - '바람의 기억'", text: "불어오는 바람 속에 너의 목소리가 묻어 나고\n지나치는 발걸음마다 너의 흔적이 남아\n내 하루는 온통 너를 기억하는 일로\n행복하게 저물어 간다." },
            { id: 20, category: "20번 시: 가슴 뛰는 그리움과 만남", title: "정희성 - '사랑'", text: "네가 곁에 없어도 네가 있는 것 같고\n네가 곁에 있으면 시간마저 멈추길 바라는\n이 이상하고 찬란한 감정을\n우리는 사랑이라 부른다." },
            { id: 21, category: "21번 시: 깊어지는 마음과 설렘의 고백", title: "이성부 - '봄'", text: "기다리지 않아도 오고\n기다림 마저 잊었을 때에도 너는 오는데\n내게 온 너는 어쩜 이토록\n찬란하고 눈부신 봄날인가." },
            { id: 22, category: "22번 시: 깊어지는 마음과 설렘의 고백", title: "문정희 - '다시 마음에'", text: "메말라가던 내 마음의 우물가에\n네가 불쑥 찾아와 내린 단비처럼\n내 가슴 깊은 곳에서부터\n맑은 사랑이 차오르기 시작한다." },
            { id: 23, category: "23번 시: 깊어지는 마음과 설렘의 고백", title: "고은 - '그 꽃'", text: "내려갈 때 보았네\n올라갈 때 못 본 그 꽃\n그리고 지친 삶의 길목에서 만난 너라는 존재는\n내게 가장 소중한 축복이었다." },
            { id: 24, category: "24번 시: 깊어지는 마음과 설렘의 고백", title: "안도현 - '너에게 묻는다'", text: "연탄장수 앞에 선 것처럼\n나도 너에게 뜨거운 존재가 되고 싶다\n내 모든 것을 태워서라도\n너의 겨울을 따뜻하게 지켜주고 싶다." },
            { id: 25, category: "25번 시: 깊어지는 마음과 설렘의 고백", title: "이해인 - '너를 만난 후'", text: "너를 만나기 전의 나는 비어 있었으나\n너를 만난 이후의 나는 온통 너로 가득 차\n매 순간이 가슴 벅찬 축제 같고\n숨 쉬는 것조차 감사하다." },
            { id: 26, category: "26번 시: 깊어지는 마음과 설렘의 고백", title: "나태주 - '풀꽃 2'", text: "자세히 보아야 예쁘다\n오래 보아야 사랑스럽다\n너도 그렇다,\n매일 봐도 질리지 않는 나의 전부다." },
            { id: 27, category: "27번 시: 깊어지는 마음과 설렘의 고백", title: "정호승 - '수선화에게'", text: "울지 마라, 외로우니까 사람이다\n살아간다는 것은 견디는 것이다\n하지만 너와 함께라면 그 어떤 외로움도\n달콤한 설렘으로 바뀔 수 있다." },
            { id: 28, category: "28번 시: 깊어지는 마음과 설렘의 고백", title: "김남조 - '편지'", text: "내 사랑을 그대에게 전하고 싶어\n수없이 적었다가 지우는 이름\n가슴이 먼저 알고 뛰는 네 이름을\n오늘 밤도 조용히 불러본다." },
            { id: 29, category: "29번 시: 깊어지는 마음과 설렘의 고백", title: "원태연 - '애원'", text: "제발 내 곁에 머물러 달라고\n소리 내어 말하지 못하지만\n떨리는 나의 눈빛과 붉어진 두 뺨이\n이미 너를 향한 내 사랑을 말해주고 있다." },
            { id: 30, category: "30번 시: 깊어지는 마음과 설렘의 고백", title: "도종환 - '접시꽃 당신'", text: "옥수수 대처럼 길고 가느다란 네 손을 잡고\n이 세상 거친 풍파를 함께 헤쳐 나가며\n비가 오면 너의 우산이 되고\n해가 나면 너의 그늘이 되어주리라." },
            { id: 31, category: "31번 시: 영원하고 싶은 눈부신 순간", title: "황인숙 - '내 심장을 밟고 지나가는 너'", text: "쿵쾅거리는 심장 소리가 들릴까 봐\n너의 손을 잡을 때마다 조마조마해\n이 떨림이 멈추지 않기를 바라며\n나는 오늘도 네 품에 머문다." },
            { id: 32, category: "32번 시: 영원하고 싶은 눈부신 순간", title: "이정하 - '기대어 앉은 그대'", text: "지친 하루의 끝에 네 어깨에 기대면\n세상의 모든 무거운 짐들이 사라지고\n오직 너의 따스한 체온만이\n나를 위로하며 감싸 안아준다." },
            { id: 33, category: "33번 시: 영원하고 싶은 눈부신 순간", title: "김용택 - '사랑'", text: "하늘에 별이 빛나고 바람이 불면\n내 마음은 어김없이 너에게로 달려가\n환한 미소를 짓고 있는 네 얼굴을\n가만히 두 손으로 그려본다." },
            { id: 34, category: "34번 시: 영원하고 싶은 눈부신 순간", title: "서정주 - '푸르른 날'", text: "눈이 부시게 푸르른 날은\n그 시절 내가 사랑했던 너를 떠올리며\n지금 내 곁에 있어 주는 네 손을\n더욱 꽉 잡고 흔들림 없이 걸어간다." },
            { id: 35, category: "35번 시: 영원하고 싶은 눈부신 순간", title: "윤동주 - '눈 오는 지붕'", text: "하얗게 쌓인 눈길 위에\n너와 나란히 남겨진 발자국을 보며\n우리의 사랑도 이 눈처럼 순수하게\n오랫동안 녹지 않기를 소원한다." },
            { id: 36, category: "36번 시: 영원하고 싶은 눈부신 순간", title: "박노해 - '너의 하늘이 보아주듯'", text: "내가 너를 바라보는 그 시선 속에\n세상에서 가장 예쁜 별을 담아둘 테니\n너는 언제나 내 눈을 보며\n환하게 웃어주기만 하면 된다." },
            { id: 37, category: "37번 시: 영원하고 싶은 눈부신 순간", title: "이채 - '행복한 동행'", text: "비록 완벽하지 않은 우리지만\n서로의 부족한 부분을 보듬어주며\n같은 곳을 바라보며 걷는 이 길이\n내 인생 가장 아름다운 길이다." },
            { id: 38, category: "38번 시: 영원하고 싶은 눈부신 순간", title: "김소월 - '초혼의 변주'", text: "부를 수도 없는 이름을 부르며 애태우던 마음이\n이제는 네가 내 이름을 불러줄 때마다\n기쁨의 눈물로 피어나니\n너는 나의 유일한 구원이자 사랑이다." },
            { id: 39, category: "39번 시: 영원하고 싶은 눈부신 순간", title: "정희성 - '모든 순간이 너였다'", text: "아침에 눈을 떠 밤에 잠들 때까지\n내 머릿속을 떠나지 않는 단 한 사람\n지나간 모든 시간 속에서\n결국 내가 찾은 정답은 너였다." },
            { id: 40, category: "40번 시: 영원하고 싶은 눈부신 순간", title: "나태주 - '설렘'", text: "네가 오는 소리에 귀 기울이며\n문을 열고 나서는 이 순간이\n내 생애 가장 가슴 뛰고 눈부신\n영원히 간직하고 싶은 사랑의 시작이다." }
        ];

        // 세트 2: 삶, 위로, 용기, 희망의 명시 40선
        const set2 = [
            { id: 1, category: "1번 시: 위로와 용기를 주는 삶의 노래", title: "정호승 - '절망의 끝에'", text: "절망의 끝에 앉아 울지 마라\n절망은 또 다른 희망의 시작이니\n바람 불고 눈보라 치는 날에도\n기꺼이 내 발걸음을 내딛어라." },
            { id: 2, category: "2번 시: 위로와 용기를 주는 삶의 노래", title: "도종환 - '담쟁이'", text: "저것은 벽\n스스로를 칠할 수 없는 벽이 채 닫기 전에\n담쟁이는 손을 뻗어 그 벽을 넘는다\n푸른 희망을 품고 끝내 이겨낸다." },
            { id: 3, category: "3번 시: 위로와 용기를 주는 삶의 노래", title: "윤동주 - '새로운 길'", text: "내를 건너서 숲으로\n고개를 넘어서 마을로\n오늘도 또 내일도\n나의 길은 새로운 희망으로 흐른다." },
            { id: 4, category: "4번 시: 위로와 용기를 주는 삶의 노래", title: "이해인 - '기쁨이 되게 하소서'", text: "오늘 하루도 누군가에게\n따뜻한 말 한마디 건네는\n맑고 투명한 기쁨의 사람이 되게 하소서\n나의 작은 미소가 누군가의 빛이 되도록." },
            { id: 5, category: "5번 시: 위로와 용기를 주는 삶의 노래", title: "나태주 - '길'", text: "어디로 가야 할지 모를 때\n잠시 멈춰 서서 하늘을 보아라\n구름은 흘러가고 길은 또 열리나니\n너는 너만의 속도로 걸어가면 된다." },
            { id: 6, category: "6번 시: 위로와 용기를 주는 삶의 노래", title: "김용택 - '참 좋은 당신'", text: "산다는 것은 참으로 놀랍고 신비한 일\n그대와 함께 호흡하며 걷는 이 길 위에서\n오늘도 감사하는 마음으로\n환하게 웃어보자." },
            { id: 7, category: "7번 시: 위로와 용기를 주는 삶의 노래", title: "고은 - '동행'", text: "혼자 가면 빨리 가지만\n함께 가면 멀리 갈 수 있나니\n지친 날에는 서로의 어깨를 내어주며\n이 길을 기꺼이 함께 걸어가자." },
            { id: 8, category: "8번 시: 위로와 용기를 주는 삶의 노래", title: "서정주 - '국화꽃 옆에서'", text: "한 송이의 국화꽃을 피우기 위해\n봄부터 소쩍새는 그렇게 울었나 보다\n네가 흘린 땀과 눈물 또한\n찬란한 꽃으로 피어날 것이다." },
            { id: 9, category: "9번 시: 위로와 용기를 주는 삶의 노래", title: "조병화 - '먼동이 트는 아침'", text: "어두운 밤이 깊을수록\n먼동이 트는 아침은 더욱 눈부신 법\n시련의 터널을 지나온 너에게\n환한 햇살이 가득 내릴 것이다." },
            { id: 10, category: "10번 시: 위로와 용기를 주는 삶의 노래", title: "정희성 - '한 그리움이 다른 그리움에게'", text: "살아간다는 것은 서로의 온기를 나누며\n어두운 길을 밝혀주는 작은 등불이 되는 일\n오늘도 우리는 서로에게 힘이 된다." },
            { id: 11, category: "11번 시: 꿈과 열정을 향한 비상", title: "김남조 - '동행'", text: "먼 길을 떠나는 이의 발걸음이 가벼운 것은\n가슴속에 품은 꿈이 영롱하기 때문\n흔들리지 말고 너의 믿음대로\n하늘 높이 날아올라라." },
            { id: 12, category: "12번 시: 꿈과 열정을 향한 비상", title: "한용운 - '복종'", text: "남들은 자유를 사랑한다지만\n나는 너라는 꿈을 향해 온전히 복종하노라\n내 모든 열정을 쏟아부어\n가장 아름다운 결실을 맺으리라." },
            { id: 13, category: "13번 시: 꿈과 열정을 향한 비상", title: "김소월 - '산유화'", text: "산에 산에 피는 꽃은\n저만치 혼자서 피어있네\n비록 남들이 알아주지 않아도\n너는 너만의 빛깔로 찬란히 빛나라." },
            { id: 14, category: "14번 시: 꿈과 열정을 향한 비상", title: "박목월 - '청노루'", text: "푸른 숲 사이로 흐르는 맑은 시냇물처럼\n잡념을 버리고 오직 앞만 보며 나아가라\n너의 젊은 날은 그 자체로 싱그러운 봄이다." },
            { id: 15, category: "15번 시: 꿈과 열정을 향한 비상", title: "김춘수 - '부활'", text: "잠들어 있던 열정을 깨우고\n새로운 아침의 태양을 향해 두 손을 뻗어라\n네 안의 잠재된 거대한 힘이\n비로소 깨어나는 순간이다." },
            { id: 16, category: "16번 시: 꿈과 열정을 향한 비상", title: "안도현 - '모닥불'", text: "재를 삼키며 더욱 뜨겁게 타오르는 모닥불처럼\n시련이 다가올수록 네 가슴의 불꽃을\n더욱 거대하게 지펴 올려라." },
            { id: 17, category: "17번 시: 꿈과 열정을 향한 비상", title: "이성부 - '별'", text: "캄캄한 밤하늘일수록 별은 더욱 선명하게 빛난다\n어려운 역경 속에서도 포기하지 않는다면\n네가 바로 그 눈부신 별이 될 것이다." },
            { id: 18, category: "18번 시: 꿈과 열정을 향한 비상", title: "문정희 - '찔레꽃'", text: "가시를 품었기에 더욱 향기로운 찔레꽃처럼\n상처와 아픔을 견뎌낸 네 삶이야말로\n가장 향기롭고 단단한 보석이다." },
            { id: 19, category: "19번 시: 꿈과 열정을 향한 비상", title: "기형도 - '질문'", text: "나는 내게 끊임없이 질문을 던진다\n오늘 나는 최선을 다했는가\n그 대답이 예스라면\n내일의 태양은 더 뜨겁게 떠오를 것이다." },
            { id: 20, category: "20번 시: 꿈과 열정을 향한 비상", title: "황인숙 - '새로운 도전'", text: "주저하지 말고 문을 열고 나가라\n세상은 넓고 너의 가능성은 무한하니\n두려움을 떨쳐내고 당차게 한 걸음 내딛어라." },
            { id: 21, category: "21번 시: 내면을 가꾸는 고요한 지혜", title: "법정 - '산에는 꽃이 피네'", text: "비움으로써 가득 채워지는 마음의 평화\n모욕과 시련이 스쳐 지나가도\n고요한 산사처럼 흔들리지 않는\n깊은 내면의 바다를 지녀라." },
            { id: 22, category: "22번 시: 내면을 가꾸는 고요한 지혜", title: "피천득 - '인연'", text: "지나간 것은 지나간 대로 아름답고\n다가올 것은 설렘으로 맞이하라\n모든 인연과 순간을 소중히 여기며\n오늘을 후회 없이 살아가자." },
            { id: 23, category: "23번 시: 내면을 가꾸는 고요한 지혜", title: "김수환 - '사랑이 밥이다'", text: "나누고 베푸는 삶이야말로 가장 아름다운 삶\n작은 친절 하나가 세상을 바꾸고\n너의 미소가 주변을 환하게 밝혀준다." },
            { id: 24, category: "24번 시: 내면을 가꾸는 고요한 지혜", title: "이해인 - '수선화'", text: "추운 겨울을 견뎌내고 노란 꽃망울을 터뜨리듯\n인내의 시간 뒤에 찾아오는 기쁨을 믿으며\n오늘도 묵묵히 너의 자리를 지켜라." },
            { id: 25, category: "25번 시: 내면을 가꾸는 고요한 지혜", title: "나태주 - '행복'", title: "저녁때를 바라보며 돌아갈 곳이 있다는 것\n힘들 때 마음 털어놓을 친구가 있다는 것\n이 소소한 일상이 곧 가장 큰 행복이다." },
            { id: 26, category: "26번 시: 내면을 가꾸는 고요한 지혜", title: "정호승 - '내가 사랑하는 사람'", title: "눈물 흘려본 자만이 타인의 눈물을 닦아줄 수 있나니\n아픔을 겪으며 더욱 따뜻해진 네 마음으로\n세상을 온화하게 품어 안아라." },
            { id: 27, category: "27번 시: 내면을 가꾸는 고요한 지혜", title: "도종환 - '흔들리지 않고 피는 꽃'", title: "젖지 않고 피는 꽃이 어디 있으랴\n비바람 속에서 뿌리를 깊게 내리듯\n고난을 통해 너는 더욱 단단해진다." },
            { id: 28, category: "28번 시: 내면을 가꾸는 고요한 지혜", title: "윤동주 - '눈'", title: "세상의 모든 더러운 것들을 덮어주는 하얀 눈처럼\n너그러운 마음과 넓은 아량으로\n세상을 포용하는 사람이 되어라." },
            { id: 29, category: "29번 시: 내면을 가꾸는 고요한 지혜", title: "김용택 - '섬진강'", title: "굽이굽이 흐르는 강물처럼 모퉁이를 돌아\n기어이 바다에 닿는 그날까지\n포기하지 않고 묵묵히 흘러가라." },
            { id: 30, category: "30번 시: 내면을 가꾸는 고요한 지혜", title: "조병화 - '낙엽'", title: "떨어진 낙엽이 거름이 되어 새싹을 키우듯\n지나간 실패와 슬픔은 모두\n너를 더 높이 성장시키는 거름이 될 것이다." },
            { id: 31, category: "31번 시: 매일 아침 맞이하는 새로운 기적", title: "헤르만 헤세 - '정원 가꾸기'", title: "씨앗을 심고 물을 주며 싹을 기다리는 마음으로\n너의 하루하루를 성실하게 가꾸어 나가면\n어느새 거대한 숲이 되어 있을 것이다." },
            { id: 32, category: "32번 시: 매일 아침 맞이하는 새로운 기적", title: "월트 휘트먼 - '길을 가며'", title: "넓고 끝없는 세상의 길 위에서\n발걸음을 당당하게 내딛고\n너만의 고유한 발자국을 깊게 남겨두어라." },
            { id: 33, category: "33번 시: 매일 아침 맞이하는 새로운 기적", title: "에밀리 디킨슨 - '만약 내가'", title: "누군가의 절망을 막아줄 수 있다면\n혹은 한 마리의 지친 새를 둥지로 돌려보낼 수 있다면\n나의 삶은 결코 헛되지 않으리라." },
            { id: 34, category: "34번 시: 매일 아침 맞이하는 새로운 기적", title: "랄프 왈도 에머슨 - '성공'", title: "자주 그리고 많이 웃는 것\n현명한 이들에게 존경을 받고\n아이들에게 사랑을 받는 것\n 그것이 진정한 성공이다." },
            { id: 35, category: "35번 시: 매일 아침 맞이하는 새로운 기적", title: "로버트 프로스트 - '가지 않은 길'", title: "숲속에 두 갈래 길이 있었고\n나는 사람이 적게 간 길을 택하였다\n그리고 그것이 나의 모든 것을 바꾸어 놓았다." },
            { id: 36, category: "36번 시: 매일 아침 맞이하는 새로운 기적", title: "윌리엄 워즈워스 - '무지개'", title: "하늘의 무지개를 볼 때마다\n내 가슴은 설레고 뛴다\n자연의 아름다움과 삶의 신비를\n언제나 순수한 눈으로 바라보아라." },
            { id: 37, category: "37번 시: 매일 아침 맞이하는 새로운 기적", title: "칼릴 지브란 - '아이들에 대하여'", title: "너희의 아이들은 너희의 아이들이 아니다\n그들은 스스로를 향해 뻗어가는\n생명의 화살일 뿐이니\n그들이 날아갈 수 있도록 날개를 펼쳐주어라." },
            { id: 38, category: "38번 시: 매일 아침 맞이하는 새로운 기적", title: "파블로 네루다 - '시'", title: "시가 나를 찾아왔다\n어디서 왔는지 모르게 내 안으로 스며들어\n거친 삶을 찬란한 예술로 물들였다." },
            { id: 39, category: "39번 시: 매일 아침 맞이하는 새로운 기적", title: "라이너 마리아 릴케 - '지중해의 시'", title: "지금 비록 힘들지라도 두려워하지 마라\n모든 위대한 것은 깊은 침묵과\n치열한 고뇌의 시간을 거쳐 탄생한다." },
            { id: 40, category: "40번 시: 매일 아침 맞이하는 새로운 기적", title: "샤를 보들레르 - '취하라'", title: "언제나 취해 있어라\n와인이든, 시든, 미덕이든\n너의 마음을 온통 사로잡는 그것에\n미치도록 열정적으로 빠져들어라." }
        ];

        let currentSet = 1;
        let currentPage = 0; // 0: 표지, 1~40: 각 시, 41: 마지막 장
        const totalPages = 40;

        const notebookBody = document.getElementById('notebookBody');
        
        function renderNotebook() {
            notebookBody.innerHTML = '';
            const poems = currentSet === 1 ? set1 : set2;

            // 1~40 페이지 동적 생성 (한국식 제본 기준 z-index 역순)
            for (let i = totalPages; i >= 1; i--) {
                const poem = poems[i - 1];
                const pageSpread = document.createElement('div');
                pageSpread.className = 'page-spread';
                pageSpread.style.zIndex = totalPages - i + 2;
                pageSpread.id = `page-${i}`;

                pageSpread.innerHTML = `
                    <div class="page">
                        <div>
                            <div class="poem-header">${poem.category}</div>
                            <div class="poem-title">${poem.title}</div>
                            <div class="poem-body">${poem.text}</div>
                        </div>
                        <div class="page-number">${i} / 40</div>
                    </div>
                `;
                notebookBody.appendChild(pageSpread);
            }

            // 41번째 페이지 (마지막 축하 완료 화면) 생성
            const completionSpread = document.createElement('div');
            completionSpread.className = 'completion-spread';
            completionSpread.style.zIndex = 1;
            completionSpread.id = `page-41`;
            
            const nextSetName = currentSet === 1 ? "삶, 위로와 희망을 주는 명시 40선" : "설레는 사랑시 40선";
            
            completionSpread.innerHTML = `
                <div class="back-cover">
                    <h2>🎉 40편의 시를 완독했습니다! 🎉</h2>
                    <p>멋진 노트에 직접 적어내려간<br>당신의 아름다운 시간에 박수를 보냅니다.</p>
                    <button class="next-step-btn" onclick="goToNextStep()">${nextSetName}으로 넘어가기 ➔</button>
                </div>
            `;
            notebookBody.appendChild(completionSpread);
        }

        renderNotebook();

        function openBook() {
            const cover = document.getElementById('bookCover');
            cover.classList.add('open');
            currentPage = 1;
            updateButtons();
        }

        function nextPage() {
            if (currentPage === 0) {
                openBook();
                return;
            }
            if (currentPage <= 41) {
                const currentElement = document.getElementById(`page-${currentPage}`);
                if (currentElement) {
                    currentElement.style.transform = 'rotateY(-180deg)'; // 한국식 왼쪽 방향으로 넘김
                }
                currentPage++;
                updateButtons();
            }
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                const prevElement = document.getElementById(`page-${currentPage}`);
                if (prevElement) {
                    prevElement.style.transform = 'rotateY(0deg)';
                }
                updateButtons();
            } else if (currentPage === 1) {
                const cover = document.getElementById('bookCover');
                cover.classList.remove('open');
                currentPage = 0;
                updateButtons();
            }
        }

        function goToNextStep() {
            // 세트 전환
            currentSet = currentSet === 1 ? 2 : 1;
            
            // 표지 텍스트 변경
            document.getElementById('coverTitle').innerText = currentSet === 1 ? "작은 1일 1시" : "마음이 머무는 시";
            document.getElementById('coverSub').innerText = currentSet === 1 ? "설레는 사랑시 40선" : "삶과 위로를 주는 명시 40선";

            // 책을 다시 덮고 리셋
            const cover = document.getElementById('bookCover');
            cover.classList.remove('open');
            
            currentPage = 0;
            renderNotebook();
            updateButtons();
        }

        function updateButtons() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            if (currentPage === 0) {
                prevBtn.disabled = true;
                nextBtn.disabled = false;
                nextBtn.innerText = "노트 펼치기";
            } else if (currentPage > 41) {
                prevBtn.disabled = false;
                nextBtn.disabled = true;
                nextBtn.innerText = "마지막 장";
            } else {
                prevBtn.disabled = false;
                nextBtn.disabled = false;
                nextBtn.innerText = currentPage === 41 ? "축하의 장" : "다음으로";
            }
        }
    </script>
</body>
</html>
